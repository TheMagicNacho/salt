name: Dev Branch Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  validate:
    name: Lint, Security & Build
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Configure Compiler
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Lint
        shell: cmd
        run: bazelisk build //:lint

      - name: Build
        shell: cmd
        run: bazelisk build //main:salt

      - name: Test
        shell: cmd
        run: bazelisk test //tests:all
