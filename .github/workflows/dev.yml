name: Dev Branch Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Security & Build
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Configure Clang / LLVM Path
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Lint Code (Clang-Format via Bazel)
        shell: cmd
        run: bazelisk build //:lint

      - name: Check for Major Vulnerabilities (cppcheck)
        shell: pwsh
        run: |
          if (-not (Get-Command cppcheck -ErrorAction SilentlyContinue)) {
            Write-Host "Installing cppcheck via Chocolatey..."
            choco install cppcheck -y --no-progress
            $cppcheckPath = "C:\Program Files\Cppcheck"
            if (Test-Path $cppcheckPath) {
              $cppcheckPath | Out-File -FilePath $env:GITHUB_PATH -Append
              $env:PATH = "$cppcheckPath;$env:PATH"
            }
          }
          Write-Host "Running vulnerability and safety checks..."
          cppcheck --enable=warning,portability --error-exitcode=1 --inline-suppr lib/ main/

      - name: Build Application (Dry Build)
        shell: cmd
        run: bazelisk build //main:salt

      - name: Run Tests
        shell: pwsh
        run: bazelisk test //tests:all
